<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>אזור ניהול — פרסום אירועים</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;700;900&display=swap" rel="stylesheet" />
  <style>
    :root { --bg:#faf6f1; --card:#fff; --ink:#2c2a3a; --accent:#7a5cd6; --accent-2:#5b3fb0; --gold:#e6a94a; --muted:#8b8798; --border:#f0e8f2; --shadow:0 16px 38px rgba(96,64,150,.16); }
    * { box-sizing: border-box; }
    body { margin:0; font-family:"Heebo","Segoe UI",Arial,sans-serif; background-color:var(--bg); background-image:radial-gradient(680px 460px at 8% -4%, rgba(244,137,107,.16), transparent 62%), radial-gradient(760px 520px at 98% 6%, rgba(122,92,214,.16), transparent 62%), radial-gradient(720px 560px at 50% 108%, rgba(63,167,150,.14), transparent 62%); background-attachment:fixed; color:var(--ink); line-height:1.6; }
    header { background:linear-gradient(135deg,#7a5cd6,#a75fc8 55%,#e07aa0); color:#fff; padding:26px 20px; border-radius:0 0 28px 28px; }
    header .in { max-width:820px; margin:0 auto; display:flex; align-items:center; justify-content:space-between; gap:16px; }
    header h1 { margin:0; font-family:"Frank Ruhl Libre",serif; font-size:1.5rem; }
    header a { color:#fff; text-decoration:none; font-weight:600; font-size:.92rem; }
    .wrap { max-width:820px; margin:0 auto; padding:24px 20px 60px; }
    .panel { background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; box-shadow:var(--shadow); margin-bottom:20px; }
    .panel h2 { margin:0 0 14px; font-family:"Frank Ruhl Libre",serif; font-size:1.25rem; }
    label { display:block; font-size:.9rem; color:var(--muted); margin:12px 0 4px; }
    input, textarea, select { width:100%; padding:11px 14px; border:1px solid var(--border); border-radius:10px; font-family:inherit; font-size:1rem; color:var(--ink); background:#fff; }
    textarea { min-height:90px; resize:vertical; }
    .row { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
    @media (max-width:560px) { .row { grid-template-columns:1fr; } }
    button.primary { margin-top:18px; border:none; background:linear-gradient(135deg,#7a5cd6,#a75fc8 55%,#e07aa0); color:#fff; padding:12px 26px; border-radius:999px; font-family:inherit; font-weight:700; font-size:1rem; cursor:pointer; transition:filter .15s; }
    button.primary:hover { filter:brightness(1.08); }
    button.primary:disabled { opacity:.6; cursor:default; }
    .muted { color:var(--muted); font-size:.9rem; }
    .status { margin-top:14px; font-size:.95rem; min-height:22px; }
    .status.ok { color:#1b7a3d; } .status.err { color:#b3261e; }
    .results { margin-top:10px; max-height:280px; overflow-y:auto; border:1px solid var(--border); border-radius:10px; display:none; }
    .results.open { display:block; }
    .res-item { padding:10px 14px; cursor:pointer; border-bottom:1px solid var(--border); }
    .res-item:last-child { border-bottom:none; }
    .res-item:hover { background:#f6f1fc; }
    .res-item .r-role { color:var(--muted); font-size:.85rem; }
    .chosen { margin-top:10px; padding:12px 14px; background:#f6f1fc; border:1px solid #e2d6f4; border-radius:12px; display:none; }
    .chosen.open { display:block; }
    .chosen b { color:var(--accent); }
    .hint { background:#fff6ec; border:1px solid #f4dcc0; border-radius:12px; padding:12px 14px; font-size:.88rem; color:#8a5a2b; margin-bottom:16px; }
  </style>
</head>
<body>
  <header>
    <div class="in">
      <h1>אזור ניהול — פרסום אירועים</h1>
      <a href="/">← חזרה לאתר</a>
    </div>
  </header>

  <div class="wrap">
    <div class="panel">
      <h2>1. התחברות</h2>
      <label>סיסמת מנהל</label>
      <input id="password" type="password" placeholder="הסיסמה שקבעת ב-Supabase" autocomplete="current-password" />
      <div class="muted" style="margin-top:6px">הסיסמה נשמרת רק במכשיר שלך. היא נבדקת בשרת בעת הפרסום.</div>
    </div>

    <div class="panel">
      <h2>2. בחירת האדם</h2>
      <label>חיפוש לפי שם</label>
      <input id="personSearch" type="search" placeholder="הקלד שם..." autocomplete="off" />
      <div class="results" id="personResults"></div>
      <div class="chosen" id="chosen"></div>
    </div>

    <div class="panel">
      <h2>3. פרטי האירוע</h2>
      <div class="hint">בלחיצה על "פרסום" האירוע יישמר ויישלחו התראות (Push + מייל) לכל מי שנרשם לאותו אדם.</div>
      <label>כותרת האירוע *</label>
      <input id="title" placeholder="למשל: טקס אזכרה שנתי" />
      <label>תיאור</label>
      <textarea id="description" placeholder="פרטים נוספים..."></textarea>
      <div class="row">
        <div>
          <label>תאריך</label>
          <input id="eventDate" type="date" />
        </div>
        <div>
          <label>שעה</label>
          <input id="eventTime" type="time" />
        </div>
      </div>
      <label>מקום</label>
      <input id="location" placeholder="למשל: בית העלמין הצבאי..." />
      <label>מפרסם (אופציונלי)</label>
      <input id="createdBy" placeholder="שם המפרסם" />
      <button class="primary" id="publishBtn">פרסום ושליחת התראות</button>
      <div class="status" id="status"></div>
    </div>
  </div>

  <script src="/config.js"></script>
  <script>
    const CFG = window.IZKOR;
    const SUPABASE_URL = CFG.SUPABASE_URL;
    const ANON = CFG.SUPABASE_ANON_KEY;
    const FUNCTIONS_URL = CFG.FUNCTIONS_URL;
    const headers = { apikey: ANON, Authorization: 'Bearer ' + ANON };

    const pwEl = document.getElementById('password');
    pwEl.value = localStorage.getItem('izkor_admin_pw') || '';
    pwEl.addEventListener('change', () => localStorage.setItem('izkor_admin_pw', pwEl.value));

    let selectedPerson = null;
    let searchTimer = null;

    function setStatus(msg, kind) {
      const el = document.getElementById('status');
      el.textContent = msg; el.className = 'status' + (kind ? ' ' + kind : '');
    }

    function choosePerson(p) {
      selectedPerson = p;
      const name = p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || 'ללא שם';
      const role = [p.rank, p.death_date ? 'נפל/ה: ' + p.death_date : null].filter(Boolean).join(' · ');
      const box = document.getElementById('chosen');
      box.innerHTML = '<div>נבחר: <b></b></div><div class="muted"></div>';
      box.querySelector('b').textContent = name;
      box.querySelector('.muted').textContent = role;
      box.classList.add('open');
      document.getElementById('personResults').classList.remove('open');
      document.getElementById('personSearch').value = name;
    }

    async function searchPersons(q) {
      const box = document.getElementById('personResults');
      if (!q || q.length < 2) { box.classList.remove('open'); box.innerHTML = ''; return; }
      const params = new URLSearchParams();
      params.set('select', 'person_id,full_name,first_name,last_name,rank,death_date');
      params.set('order', 'full_name.asc');
      params.set('limit', '12');
      params.set('full_name', 'ilike.*' + q + '*');
      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/persons?' + params.toString(), { headers });
        const rows = await res.json();
        box.innerHTML = '';
        if (!rows.length) { box.classList.remove('open'); return; }
        rows.forEach((p) => {
          const name = p.full_name || [p.first_name, p.last_name].filter(Boolean).join(' ') || 'ללא שם';
          const item = document.createElement('div');
          item.className = 'res-item';
          item.innerHTML = '<div></div><div class="r-role"></div>';
          item.querySelector('div').textContent = name;
          item.querySelector('.r-role').textContent = [p.rank, p.death_date].filter(Boolean).join(' · ');
          item.addEventListener('click', () => choosePerson(p));
          box.appendChild(item);
        });
        box.classList.add('open');
      } catch (e) { /* ignore */ }
    }

    document.getElementById('personSearch').addEventListener('input', (e) => {
      selectedPerson = null;
      document.getElementById('chosen').classList.remove('open');
      clearTimeout(searchTimer);
      const q = e.target.value.trim();
      searchTimer = setTimeout(() => searchPersons(q), 250);
    });

    async function publish() {
      const password = pwEl.value.trim();
      const title = document.getElementById('title').value.trim();
      if (!password) { setStatus('יש להזין סיסמת מנהל.', 'err'); return; }
      if (!selectedPerson) { setStatus('יש לבחור אדם מהרשימה.', 'err'); return; }
      if (!title) { setStatus('יש להזין כותרת לאירוע.', 'err'); return; }

      const btn = document.getElementById('publishBtn');
      btn.disabled = true; setStatus('מפרסם ושולח התראות...');
      try {
        const res = await fetch(FUNCTIONS_URL + '/publish-event', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json', apikey: ANON, Authorization: 'Bearer ' + ANON },
          body: JSON.stringify({
            password,
            person_id: selectedPerson.person_id,
            title,
            description: document.getElementById('description').value.trim() || null,
            event_date: document.getElementById('eventDate').value || null,
            event_time: document.getElementById('eventTime').value || null,
            location: document.getElementById('location').value.trim() || null,
            created_by: document.getElementById('createdBy').value.trim() || null,
          }),
        });
        const data = await res.json().catch(() => ({}));
        if (res.status === 401) { setStatus('סיסמה שגויה.', 'err'); }
        else if (!res.ok) { setStatus('שגיאה: ' + (data.error || res.status) + (data.detail ? ' — ' + data.detail : ''), 'err'); }
        else {
          localStorage.setItem('izkor_admin_pw', password);
          const r = data.results || {};
          setStatus('פורסם ✓  נשלחו ' + (r.pushed || 0) + ' התראות Push ו-' + (r.mailed || 0) + ' מיילים (מתוך ' + (r.total || 0) + ' מנויים).', 'ok');
          document.getElementById('title').value = '';
          document.getElementById('description').value = '';
          document.getElementById('eventDate').value = '';
          document.getElementById('eventTime').value = '';
          document.getElementById('location').value = '';
        }
      } catch (err) {
        setStatus('שגיאה: ' + err.message, 'err');
      } finally {
        btn.disabled = false;
      }
    }

    document.getElementById('publishBtn').addEventListener('click', publish);
  </script>
</body>
</html>
